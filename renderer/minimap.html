<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' app:; style-src 'self' 'unsafe-inline'; img-src 'self' app: data:; connect-src 'self' app:" />
  <title>小地图</title>
  <style>
    html, body {
      width: 100%; height: 100%; margin: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
      /* 整个圆盘都是"拖动窗口"的把手 */
      cursor: move;
    }
    /* 圆盘只裁剪地图本体：裁剪挂在 body 上会把边缘的 UI 一起裁掉 */
    #mini-root {
      position: absolute; inset: 0;
      /* 不透明圆形底盘：即使底图/玩家还没绘制，雷达也始终可见（透明窗口一旦不重绘就会"看着消失"） */
      background: radial-gradient(circle at 50% 50%, rgba(11,14,19,0.90) 0%, rgba(11,14,19,0.95) 72%, rgba(6,8,12,0.98) 100%);
      border-radius: 50%;
      overflow: hidden;
      clip-path: circle(50% at 50% 50%);
      box-shadow: inset 0 0 0 2px rgba(34,211,238,0.35), inset 0 0 24px rgba(0,0,0,0.55);
    }
    body.dragging #mini-root { box-shadow: inset 0 0 0 2px rgba(34,211,238,0.85), inset 0 0 24px rgba(0,0,0,0.55); }
    /* 与主窗口 map.css 一致的 mapstage 布局（迷你窗单独维护） */
    .mapstage { position: absolute; inset: 0; cursor: move; }
    .mapstage.dragging { cursor: move; }
    .mapstage-svg { width: 100%; height: 100%; display: block; }
    .mapstage-overlay { position: absolute; inset: 0; pointer-events: none; }
    .mapstage-overlay svg { width: 100%; height: 100%; }
    .map-marker { pointer-events: auto; cursor: move; }
    .player-pulse { animation: pulse 1.6s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(2.2); opacity: 0; } }

    /* 雷达默认不带任何常驻按钮：
       固定地图方向 / 是否自动居中 / 自动切换楼层 / 点击穿透 / 整体透明度 都在"设置"里调，
       滚轮始终可缩放雷达。
       右下角这两个小按钮是"鼠标靠近才出现"的：
         - 未锁定 -> 显示「锁」（开启点击穿透：看得到点不着）
         - 已锁定 -> 显示「解锁」（关闭点击穿透；锁定时窗口收不到鼠标移动，
           由主进程按光标命中这个小条的位置，判定"靠近"后临时恢复交互） */
    #mini-lockbar {
      position: absolute; right: 3px; bottom: 3px; z-index: 10;
      display: flex; gap: 4px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.12s ease;
    }
    body.hot #mini-lockbar { opacity: 1; }                                      /* 锁定时：鼠标放在雷达上就显示 */
    body.bar-live #mini-lockbar { pointer-events: auto; }                       /* 只有移到小条上才接管鼠标 */
    body:not(.locked):hover #mini-lockbar { opacity: 1; pointer-events: auto; } /* 未锁定时：悬停即显示可点 */
    #mini-lockbar button {
      display: flex; align-items: center; justify-content: center;
      padding: 3px 8px; cursor: pointer;
      background: rgba(10,14,20,.72); color: #d7e0ea;
      border: 1px solid #2a3444; border-radius: 7px;
      font: 600 11px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif;
      white-space: nowrap;
    }
    #mini-lockbar button:hover { border-color: #22d3ee; color: #22d3ee; }
    body.locked #mini-lock { display: none; }
    body:not(.locked) #mini-unlock { display: none; }
  </style>
</head>
<body>
  <div id="mini-root"></div>
  <div id="mini-lockbar">
    <button id="mini-lock" tabindex="-1" title="锁定：开启点击穿透，雷达看得到点不着（鼠标直接作用到游戏）">锁</button>
    <button id="mini-unlock" tabindex="-1" title="解锁：关闭点击穿透，恢复用鼠标操作雷达">解锁</button>
  </div>
  <script type="module" src="minimap.js"></script>
</body>
</html>
