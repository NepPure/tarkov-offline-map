<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <!-- 与 map.html 同一套 CSP：启动图只加载本地图片，不联网 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' app:; style-src 'self' 'unsafe-inline'; img-src 'self' app: data:; connect-src 'self' app:" />
  <title>塔科夫地图</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0b0e13; color: #d7e0ea; overflow: hidden;
      font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; user-select: none;
      -webkit-app-region: drag; }
    img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 12px;
      background: linear-gradient(transparent, rgba(8, 11, 15, .92) 40%);
      font-size: 12px; color: #8b98a8; display: flex; align-items: center; gap: 8px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #22d3ee; animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <img src="splash.png" alt="塔科夫地图" />
  <div class="bar"><span class="dot"></span><span>正在启动…内置数据较大，首次打开请稍等</span></div>
</body>
</html>
