name: Server image (ghcr)

# 房间服务端：跑单测 → 构建镜像 → 推到 ghcr。
#   push 到 main（server/** 有改动）-> 推 :latest 与 :sha-xxxxxxx
#   push tag v1.2.3                 -> 额外推 :1.2.3 与 :1.2
#   PR                              -> 只跑测试 + 只构建，不推
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'server/**'
      - 'src/room-key.js'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'src/room-key.js'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server deps
        working-directory: server
        run: npm ci --no-audit --no-fund

      # 含与客户端 src/room-key.js 的交叉校验（两份房间号算法必须一致）
      - name: Unit + integration tests
        working-directory: server
        run: npm test

  image:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像名必须全小写（ghcr 不接受大写仓库属主名）
      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/neppure/tarkov-offline-map-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: server
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
